name: CI

on:
  push:
  pull_request:

# ArenaEdgeTest is excluded from the gating runs and reported separately: it
# exercises >64-byte over-alignment, a known limitation of the frozen arena
# allocator. (ArenaStressTest's absolute-nanosecond budgets are now enforced
# only in optimized builds and skipped otherwise, so it is not excluded.)
env:
  EXCLUDE_TESTS: "ArenaEdgeTest"

jobs:
  build-test:
    name: build & test (${{ matrix.cxx }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++-14, build_type: Release }
          - { cxx: g++-14, build_type: Debug }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cxx }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DBUILD_TESTS=ON -DBUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -E "${EXCLUDE_TESTS}"

      - name: Arena tests (informational, non-gating)
        working-directory: build
        continue-on-error: true
        run: ctest --output-on-failure -R "${EXCLUDE_TESTS}"

  sanitizers:
    name: ASan + UBSan (g++-14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure (ASan/UBSan)
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DBUILD_TESTS=ON -DBUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j

      - name: Test under sanitizers
        working-directory: build-san
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --output-on-failure -E "${EXCLUDE_TESTS}"

  falsifiability:
    name: falsifiability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      # A gate that has never been seen to fail is not known to be a gate. This
      # injects a comment edit, which no assertion can detect, and requires the
      # gate to report it as surviving.
      - name: Self-test (the gate must be able to fail)
        run: python3 tools/falsifiability.py --self-test --build-dir build

      # A parser is quietly wrong in two ways: it builds the wrong TREE for input
      # it accepts, and it accepts input it should refuse. Precedence is the
      # first, the depth guard the second, and both are invisible to a test that
      # only asks "did it parse".
      - name: Falsifiability gate
        run: python3 tools/falsifiability.py --build-dir build

  # ---------------------------------------------------------------------------
  # Line coverage for THIS repository, recomputed every run against a recorded
  # baseline. Each repo measures itself: the same files read very differently
  # from the umbrella's suite, which exercises the query path and builds this
  # repo for its own purposes. A ratchet on one total, not per-file targets.
  #
  # Coverage is what was REACHED, never what was CHECKED - the falsifiability
  # gate above is what decides whether reaching a line means anything.
  # ---------------------------------------------------------------------------
  coverage:
    name: line coverage (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          if command -v g++-14 >/dev/null 2>&1; then
            echo "g++-14 already present: $(g++-14 --version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi

      - name: Coverage
        run: ./scripts/coverage.sh build-coverage
